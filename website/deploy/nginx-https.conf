server {
    listen 80;
    listen [::]:80;
    server_name agent.li33.art;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/agent.li33.art/acme;
        default_type text/plain;
    }
    location / { return 301 https://agent.li33.art$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.li33.art;
    root /var/www/agent.li33.art/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/agent.li33.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.li33.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { try_files $uri $uri/ =404; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache";
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    access_log /var/log/nginx/agent.li33.art.access.log;
    error_log /var/log/nginx/agent.li33.art.error.log;
}
